name: Build Snow Shot macOS Static DMG

on:
  push:
    branches:
      - ci/macos-dmg-static
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-macos-arm64:
    name: Build static macOS arm64 DMG
    runs-on: macos-15
    timeout-minutes: 360

    env:
      QT_STATIC_PREFIX: ${{ github.workspace }}/.tools/qt/6.11.1/macos-static-arm64

    steps:
      - name: Select Xcode 26.3
        shell: bash
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version
          xcrun clang++ --version
          SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"
          echo "SDKROOT=$SDKROOT" >> "$GITHUB_ENV"
          echo "MACOSX_DEPLOYMENT_TARGET=15.0" >> "$GITHUB_ENV"
          echo "Using SDKROOT=$SDKROOT"
          test -d "$SDKROOT"

      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          target: aarch64-apple-darwin
          components: rustfmt, clippy

      - name: Prepare host tools
        shell: bash
        run: |
          echo "$(dirname "$(xcrun --find clang++)")" >> "$GITHUB_PATH"
          if ! command -v clang-format >/dev/null 2>&1; then
            if xcrun --find clang-format >/dev/null 2>&1; then
              echo "$(dirname "$(xcrun --find clang-format)")" >> "$GITHUB_PATH"
            else
              brew install clang-format
            fi
          fi
          cmake --version
          ninja --version
          pkg-config --version
          python3 --version
          clang-format --version || xcrun clang-format --version
          rustc --version

      - name: Verify Apple SDK linker visibility
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/sdk-link.c" <<'C'
          #include <math.h>
          int main(void) { return fabs(cos(0.0) - 1.0) < 1e-12 ? 0 : 2; }
          C
          CC="$(xcrun --find cc)"
          echo "CC=$CC"
          "$CC" -arch arm64 -mmacosx-version-min=15.0 "$RUNNER_TEMP/sdk-link.c" -lm -o "$RUNNER_TEMP/sdk-link"
          "$RUNNER_TEMP/sdk-link"
          "$CC" -v -arch arm64 -mmacosx-version-min=15.0 "$RUNNER_TEMP/sdk-link.c" -o "$RUNNER_TEMP/sdk-link-system" 2>&1 | tail -80
          "$RUNNER_TEMP/sdk-link-system"

      - name: Verify C++20 stop_token support
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/stop_token.cpp" <<'CPP'
          #include <stop_token>
          int main() {
              std::stop_source source;
              std::stop_token token = source.get_token();
              return token.stop_possible() ? 0 : 1;
          }
          CPP
          xcrun clang++ -std=c++20 -mmacosx-version-min=15.0 "$RUNNER_TEMP/stop_token.cpp" -o "$RUNNER_TEMP/stop_token"
          "$RUNNER_TEMP/stop_token"

      - name: Restore static vcpkg install
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .tools/macos/installed/static
            .tools/vcpkg/downloads
          key: snow-shot-vcpkg-static-arm64-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'cmake/vcpkg-overlay-ports/**', 'cmake/vcpkg-overlay-triplets/**') }}

      - name: Restore static Qt kit
        id: qt-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.QT_STATIC_PREFIX }}
          key: snow-shot-qt-6.11.1-static-arm64-${{ hashFiles('scripts/build-static-qt.sh', 'cmake/vcpkg-overlay-triplets/arm64-osx-snow-shot-static.cmake', 'vcpkg.json') }}

      - name: Bootstrap static vcpkg dependencies
        shell: bash
        run: |
          chmod +x scripts/*.sh
          scripts/bootstrap-macos.sh snow-shot-macos-arm64-release --skip-qt-validation

      - name: Verify minizip is zlib-only
        shell: bash
        run: |
          TRIPLET_ROOT="$GITHUB_WORKSPACE/.tools/macos/installed/static/arm64-osx-snow-shot-static"
          CONFIG_DIR="$TRIPLET_ROOT/share/minizip-ng"
          export PKG_CONFIG_PATH="$TRIPLET_ROOT/lib/pkgconfig"
          echo "minizip static libs:"
          pkg-config --libs --static minizip-ng
          if grep -RniE 'LibLZMA|BZip2|OpenSSL|ZSTD' "$CONFIG_DIR"; then
            echo "::error::minizip exported an undeclared optional dependency"
            exit 1
          fi

      - name: Save static vcpkg install
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .tools/macos/installed/static
            .tools/vcpkg/downloads
          key: snow-shot-vcpkg-static-arm64-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'cmake/vcpkg-overlay-ports/**', 'cmake/vcpkg-overlay-triplets/**') }}

      - name: Build audited static Qt 6.11.1
        shell: bash
        run: |
          scripts/build-static-qt.sh             --arch arm64             --install-prefix "$QT_STATIC_PREFIX"             --parallel 4
          test -f "$QT_STATIC_PREFIX/lib/cmake/Qt6/Qt6Config.cmake"
          test -f "$QT_STATIC_PREFIX/share/snow-apps/static-qt-build.json"

      - name: Save static Qt kit
        if: steps.qt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.QT_STATIC_PREFIX }}
          key: snow-shot-qt-6.11.1-static-arm64-${{ hashFiles('scripts/build-static-qt.sh', 'cmake/vcpkg-overlay-triplets/arm64-osx-snow-shot-static.cmake', 'vcpkg.json') }}

      - name: Configure static Qt
        shell: bash
        run: |
          echo "SNOW_QT_STATIC_DIR=$QT_STATIC_PREFIX/lib/cmake/Qt6" >> "$GITHUB_ENV"
          echo "Qt6_DIR=$QT_STATIC_PREFIX/lib/cmake/Qt6" >> "$GITHUB_ENV"

      - name: Preflight generated icon pack
        shell: bash
        run: |
          python3 snow_shot/tools/build_icon_manifest.py
          python3 ant_design_qt/tools/generate_icon_pack.py             snow_shot/resources/icons.manifest.json             --header snow_shot/include/snow_shot/presentation/components/icons/snowshoticons.h             --source snow_shot/src/presentation/components/icons/snowshoticons.cpp

      - name: Build static Snow Shot
        shell: bash
        run: |
          scripts/build.sh snow-shot-macos-arm64-release --clean --target snow_shot --parallel 4

      - name: Verify final binary has no Homebrew dylibs
        shell: bash
        run: |
          APP_BIN="build/snow-shot-macos-arm64-release/snow_shot/snow_shot.app/Contents/MacOS/snow_shot"
          test -x "$APP_BIN"
          otool -L "$APP_BIN" | tee "$RUNNER_TEMP/snow-shot-otool.txt"
          if grep -F '/opt/homebrew/' "$RUNNER_TEMP/snow-shot-otool.txt"; then
            echo "::error::Static Snow Shot still links a Homebrew dylib"
            ninja -C build/snow-shot-macos-arm64-release -t commands snow_shot > "$RUNNER_TEMP/snow-shot-link-commands.txt"
            echo "Relevant link command fragments:"
            grep -nE '/opt/homebrew|lzma|bz2|ssl|crypto' "$RUNNER_TEMP/snow-shot-link-commands.txt" | tail -100 || true
            exit 1
          fi

      - name: Package static DMG
        shell: bash
        run: |
          scripts/package-snow-shot.sh snow-shot-macos-arm64-release --skip-build

      - name: Inspect generated package
        shell: bash
        if: always()
        run: |
          find build/snow-shot-macos-arm64-release -maxdepth 3 -type f \
            \( -name '*.dmg' -o -name '*.sha256' -o -name 'macos-ocr-verification.json' \) -print 2>/dev/null || true

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: snow-shot-macos-arm64-static-dmg
          path: |
            build/snow-shot-macos-arm64-release/*.dmg
            build/snow-shot-macos-arm64-release/*.sha256
            build/snow-shot-macos-arm64-release/macos-ocr-verification.json
          if-no-files-found: error
          retention-days: 14
