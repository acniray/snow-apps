name: Build Snow Shot macOS DMG

on:
  push:
    branches:
      - build-macos-dmg
    paths:
      - ".github/workflows/build-macos-dmg.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-macos-arm64:
    name: Build macOS arm64 DMG
    runs-on: macos-15
    timeout-minutes: 360

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install host build tools
        run: |
          brew install cmake ninja pkgconf nasm

      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          target: aarch64-apple-darwin
          components: rustfmt, clippy

      - name: Install Qt 6.11.1
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.11.1"
          host: mac
          target: desktop
          arch: clang_64
          modules: "qtsvg qttools"
          cache: true

      - name: Verify toolchain
        run: |
          uname -a
          uname -m
          cmake --version
          ninja --version
          rustc --version
          qmake6 -query QT_VERSION || true
          echo "QT_ROOT_DIR=$QT_ROOT_DIR"
          test -f "$QT_ROOT_DIR/lib/cmake/Qt6/Qt6Config.cmake"

      - name: Bootstrap Snow Shot macOS release
        env:
          Qt6_DIR: ${{ env.QT_ROOT_DIR }}/lib/cmake/Qt6
        run: |
          scripts/bootstrap-macos.sh snow-shot-macos-arm64-release

      - name: Build and package DMG
        env:
          Qt6_DIR: ${{ env.QT_ROOT_DIR }}/lib/cmake/Qt6
          SNOW_MACOS_CODESIGN_IDENTITY: "-"
        run: |
          scripts/package-snow-shot.sh snow-shot-macos-arm64-release

      - name: Locate packages
        id: packages
        run: |
          echo "Generated package files:"
          find build/snow-shot-macos-arm64-release -type f \( -name "*.dmg" -o -name "*.sha256" \) -print
          DMG="$(find build/snow-shot-macos-arm64-release -type f -name "*.dmg" -print -quit)"
          if [ -z "$DMG" ]; then
            echo "::error::No DMG was generated"
            exit 1
          fi
          shasum -a 256 "$DMG" | tee "$DMG.sha256"

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: snow-shot-macos-arm64-dmg
          path: |
            build/snow-shot-macos-arm64-release/**/*.dmg
            build/snow-shot-macos-arm64-release/**/*.dmg.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
